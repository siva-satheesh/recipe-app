<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />
    
    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO and Accessibility Meta Tags -->
    <meta name="description" content="recipe - A delightful app to discover and share eggstraordinary recipes for any appetite. Crack, cook, and enjoy!">
    <meta name="keywords" content="recipes, cooking, food, egg recipes, meal ideas, culinary app">
    <meta name="author" content="Your Name or Team Name">
    
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="recipe - Crack, Cook, Enjoy">
    <meta property="og:description" content="Discover eggstraordinary recipes for any appetite with the recipe app.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-app-url.com"> <!-- Replace with your app's URL -->
    <meta property="og:image" content="https://your-app-url.com/og-image.jpg"> <!-- Replace with an image URL for social sharing -->
    
    <!-- Favicon (replace with your own icon) -->
    <link rel="icon" type="image/png" href="/favicon.png" /> <!-- Placeholder; replace with your favicon -->
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Global CSS Reset to Remove White Borders -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden; /* Prevent horizontal scrollbars */
      }
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
    </style>
    
    <!-- Title -->
    <title>recipe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
